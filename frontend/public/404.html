
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>KARUMBU</title>
    <script>
      const segmentCount = 1;
      const location = window.location;
      const pathSegments = location.pathname.split("/");
      const route = pathSegments.slice(segmentCount + 1).join("/");
      const query = location.search;
      const hash = location.hash;

      location.replace(
        location.origin +
          "/karumbu/" +
          (route ? route : "") +
          query +
          hash
      );
    </script>
  </head>
  <body>
    Redirecting to KARUMBU...
  </body>
</html>
