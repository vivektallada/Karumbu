
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KARUMBU</title>

    <script>
      const segmentCount = 1;
      const location = window.location;
      const pathSegments = location.pathname.split("/");
      const route = pathSegments.slice(segmentCount + 1).join("/");
      const query = location.search;
      const hash = location.hash;

      location.replace(
        location.origin +
          "/Karumbu/" +
          route +
          query +
          hash
      );
    </script>
  </head>

  <body>
    <p>Redirecting to KARUMBU...</p>
  </body>
</html>
